<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LernApp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#6C5CE7">
<title>LernApp</title>
<style>
:root{
  --bg:#F4F1FF; --card:#FFFFFF; --ink:#2D2A4A; --soft:#6E6A8F;
  --lila:#6C5CE7; --lila2:#A29BFE; --gruen:#00B894; --gruen2:#E3FAF3;
  --rot:#E17055; --rot2:#FDEDE8; --gelb:#FDCB6E; --blau:#0984E3; --pink:#FD79A8;
  --line:#E4E0F5; --shadow:0 4px 0 rgba(45,42,74,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:22px;margin:0;flex:1}
.pill{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.coach{display:flex;gap:12px;align-items:center}
.owl{font-size:54px;line-height:1;flex:none;animation:wipp 3s ease-in-out infinite}
@keyframes wipp{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.bubble{background:#FFF7E0;border-radius:18px;padding:10px 14px;font-weight:600;position:relative}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;font-weight:800;font-size:20px;
  background:var(--lila);color:#fff;box-shadow:0 5px 0 #4B3CC4;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4B3CC4}
.btn.gruen{background:var(--gruen);box-shadow:0 5px 0 #00896E}
.btn.weiss{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.klein{padding:10px 14px;font-size:17px;width:auto}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px 10px;text-align:center;box-shadow:var(--shadow);font-weight:800;border:2px solid transparent}
.tile:active{transform:translateY(2px)}
.tile .ico{font-size:38px;display:block;margin-bottom:4px}
.tile small{display:block;font-weight:600;color:var(--soft);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gruen),#55EFC4);border-radius:99px;transition:width .4s}
.muted{color:var(--soft);font-size:15px}
h2{font-size:20px;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700}
.chip.on{background:var(--lila);color:#fff;border-color:var(--lila)}
/* Übung */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{font-size:26px;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
.prompt{text-align:center;padding:26px 14px}
.prompt .lbl{color:var(--soft);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.prompt .wort{font-size:34px;font-weight:900;margin:8px 0;word-break:break-word}
.prompt .bsp{font-style:italic;color:var(--soft)}
.speak{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--blau);color:#fff;font-size:24px;box-shadow:0 4px 0 #0864AE;margin:4px}
.speak.slow{background:var(--gelb);box-shadow:0 4px 0 #D9A84A}
.speak.mini{width:38px;height:38px;font-size:18px}
.opts{display:grid;gap:12px}
@media (min-width:560px){ .opts{grid-template-columns:1fr 1fr} }
.opts.viele{grid-template-columns:1fr 1fr;gap:10px}
.opts.viele .opt{padding:11px 12px}
.satz-ziel{min-height:60px;border:3px dashed var(--line);border-radius:16px;padding:10px;margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:#FAF9FF}
.satz-vorrat{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.kachel{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:19px;box-shadow:var(--shadow)}
.kachel.gelegt{border-color:var(--lila2);background:#EEEBFF}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;font-weight:700;text-align:left;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--soft)}
.opt.richtig{border-color:var(--gruen);background:var(--gruen2)}
.opt.falsch{border-color:#F39C4A;background:#FFF4E8;animation:wackel .35s}
@keyframes wackel{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input.tip{width:100%;font:inherit;font-size:26px;font-weight:800;text-align:center;padding:14px;border-radius:18px;border:3px solid var(--line);outline:none;background:#fff;color:var(--ink)}
input.tip:focus{border-color:var(--lila2)}
input.tip.richtig{border-color:var(--gruen);background:var(--gruen2)}
input.tip.falsch{border-color:#F39C4A;background:#FFF4E8}
.feedback{border-radius:20px;padding:14px 16px;margin-top:14px;font-weight:700}
.feedback.ok{background:var(--gruen2);color:#00704F}
.feedback.no{background:#FFF1E3;color:#9A4E12}
.feedback.fast{background:#FFF3D6;color:#8A5A00}
.feedback .loesung{font-size:24px;font-weight:900;color:var(--ink);margin-top:4px}
.hinweis{background:#FFF3D6;border-radius:14px;padding:8px 12px;font-size:15px;margin-top:10px;font-weight:600}
.stern{display:inline-block;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.paare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paar{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px 8px;font-weight:800;box-shadow:var(--shadow);min-height:64px}
.paar.sel{border-color:var(--lila);background:#EEEBFF}
.paar.weg{visibility:hidden}
.paar.falsch{border-color:var(--rot);animation:wackel .35s}
.wl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:none}
.wl .e{font-weight:800}
.wl .d{color:var(--soft);font-size:15px}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gruen)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);font-weight:700;font-size:15px}
.badge .ico{font-size:40px;display:block}
.badge.zu{opacity:.35;filter:grayscale(1)}
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.flip.um .in{transform:rotateY(180deg)}
.flip .seite{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.flip .hinten{transform:rotateY(180deg)}
.ring{width:74px;height:74px;flex:none}
.rec{background:var(--rot);box-shadow:0 4px 0 #B8553E}
.rec.laeuft{animation:puls 1s infinite}
@keyframes puls{50%{transform:scale(1.12)}}
canvas#konfetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.spielfeld{display:block;margin:0 auto;border-radius:18px;box-shadow:var(--shadow);background:#EAF6FF;touch-action:none;user-select:none}
.steuer{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .4s;text-align:center;max-width:90vw}
.mikro{width:96px;height:96px;font-size:44px;border-radius:50%;background:var(--rot);color:#fff;box-shadow:0 5px 0 #B8553E;display:inline-flex;align-items:center;justify-content:center}
.mikro.laeuft{animation:puls 1s infinite;background:var(--pink)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-weight:600;box-shadow:var(--shadow)}
.msg.eule{background:#FFF7E0;align-self:flex-start;border-bottom-left-radius:4px}
.msg.kind{background:#EEEBFF;align-self:flex-end;border-bottom-right-radius:4px}
.msg b.en{font-size:22px;color:var(--lila)}
.en-inline{color:var(--lila);font-weight:900}
.msg .chip{font-size:15px;padding:6px 10px;text-align:left}
.eulenleiste{padding:12px;position:sticky;bottom:8px;text-align:center}
.eulenleiste .mikro{width:72px;height:72px;font-size:34px}
@media (max-height:700px){ .eulenleiste .hinweistext{display:none} }
.weg-bst{color:var(--rot);text-decoration:line-through;text-decoration-thickness:3px}
.apo{color:var(--rot);font-weight:900}
.fehlerbst{background:#FFE08A;color:#B03A1E;border-radius:4px;padding:0 2px;text-decoration:underline}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--soft)}
.hidden{display:none!important}
@media (max-width:420px){ .prompt .wort{font-size:28px} .btn{font-size:18px} .owl{font-size:44px} }
/* Mathe */
.mfrage{font-variant-numeric:tabular-nums}
.mteil{font-size:21px;font-weight:800;margin:10px 0 8px;text-align:center}
.mein{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.mein input.tip{width:auto;flex:1 1 140px;max-width:260px;min-width:0}
.mein input.tip.kurz{flex:0 1 96px;max-width:110px}
.mein .einh{font-size:24px;font-weight:900}
.merledigt{margin:4px 0}
.mzeile-fertig{padding:6px 12px;border-radius:12px;margin:4px 0;font-weight:700}
.mzeile-fertig.ok{background:var(--gruen2)}
.mzeile-fertig.no{background:#FFF4E8}
.mweg{margin-top:8px;font-size:19px;line-height:1.5;color:var(--ink)}
.treppe{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin:12px 0}
.treppe .st{padding:8px 12px;border-radius:12px;background:var(--bg);font-weight:900;font-size:20px;border:3px solid var(--line);min-width:48px;text-align:center}
.treppe .st.an{border-color:var(--lila2);background:#EEEBFF}
.treppe .st.jetzt{border-color:var(--lila);background:var(--lila);color:#fff}
.treppe .pf{font-size:15px;font-weight:800;color:var(--soft);text-align:center;line-height:1.15}
.treppe .pf.an{color:var(--lila)}
table.etafel{border-collapse:collapse;margin:12px auto 4px;font-weight:800;font-size:18px;color:var(--ink)}
table.etafel th,table.etafel td{border:2px solid var(--line);padding:4px 8px;text-align:center;min-width:30px}
table.etafel th{background:#EEEBFF;font-size:15px}
table.etafel th.lab{background:none;border:none;text-align:right;white-space:nowrap}
table.etafel td.komma{border-right:4px solid var(--rot)}
.pfeil{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;text-align:center;margin:10px 0;line-height:1.6}
.mzeile{display:flex;gap:10px;align-items:center;width:100%;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
.mzeile:last-child{border-bottom:none}
.msmiley{font-size:30px;flex:none;width:40px;text-align:center}
.mzeile.aus{opacity:.55}
.mreihe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;min-height:52px;padding:8px;border:3px dashed var(--line);border-radius:16px;background:#FAF9FF;margin-top:6px}
select.msel{font:inherit;font-size:15px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);max-width:48%}
</style>
</head>
<body>
<canvas id="konfetti"></canvas>
<div class="wrap" id="app"></div>

<script src="vokabeln.js"></script>
<script src="mathe.js"></script>
<script>
"use strict";
/* ================== Daten ================== */
const W = (window.VOKABELN || []).map((v, i) => Object.assign({ id: v.s + ":" + v.en }, v));
const SEITEN = [...new Set(W.map(w => w.s))].sort((a, b) => a - b);
const KEY = "englisch-lernapp-v1";
const INTERVALL = [0, 0, 1, 3, 7, 14]; // Tage bis zur nächsten Wiederholung je Kiste
const RUNDE = 10;
// Kurzformen: eigene Lernkarten mit Kennung "kf:<Kurzform>"
const KF = (window.KURZFORMEN || []).map(f => Object.assign({ id: "kf:" + f.k, kf: true, en: f.k, de: f.l }, f));

function heute(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function plusTage(n) { const d = new Date(); d.setDate(d.getDate() + n); return heute(d); }

const START = { kiste: {}, sterne: 0, tage: [], badges: {}, stat: { richtig: 0, getippt: 0, gesprochen: 0, runden: 0, paarePerfekt: 0, comeback: 0, gesagt: 0, fragen: 0, tests: 0, testPerfekt: 0 }, tests: [], mathe: { f: {}, rundenDauer: [], richtig: 0, runden: 0, proben: [] }, fach: "englisch",
  heute: { datum: "", antworten: 0 }, ein: { seiten: SEITEN.slice(), ton: true, tempo: 0.85, mikro: true, euleSpricht: true, kfRunde: true, stimme: "", stimmeDE: "", testKF: true, autoMikro: true, minuten: 10, mAus: [] } };
let S = laden();
function laden() {
  try { const t = localStorage.getItem(KEY); if (t) { const o = JSON.parse(t); return tiefMischen(JSON.parse(JSON.stringify(START)), o); } } catch (e) {}
  return JSON.parse(JSON.stringify(START));
}
function tiefMischen(a, b) { for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object") tiefMischen(a[k], b[k]); else a[k] = b[k]; } return a; }
/* Speichern: immer im Browser UND (beim Start über „LernApp starten“) automatisch in daten/lernstand.json.
   Grund: Auf diesem PC löscht Edge Websitedaten beim Schließen (Firmenrichtlinie DefaultCookiesSetting = 4, „nur Sitzung“).
   Beim Start wird der neuere Stand genommen – Datei oder Browser. */
// Server gibt es nur am PC („LernApp starten“, localhost). Im Internet (Tablet-Fassung auf GitHub Pages) speichert nur der Browser.
const SERVER = /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const TABLET = /^https?:$/.test(location.protocol) && !SERVER;
const ALS_APP = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
if (TABLET && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); // Browser bitten, den Fortschritt nicht zu löschen
let speicherTimer = null, dateiGeprueft = false, letzteDateiSicherung = null;
function speichern() {
  S.nr = (S.nr || 0) + 1; S.gespeichert = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (SERVER) { clearTimeout(speicherTimer); speicherTimer = setTimeout(dateiSpeichern, 1500); }
}
function dateiSpeichern(beimSchliessen) {
  if (!SERVER || !dateiGeprueft) return; // nie speichern, bevor der Stand aus der Datei geprüft wurde
  clearTimeout(speicherTimer); speicherTimer = null;
  const body = JSON.stringify(S);
  if (beimSchliessen === true && navigator.sendBeacon) { navigator.sendBeacon("lernstand", new Blob([body], { type: "application/json" })); return; }
  // Antwortet der Server nicht innerhalb von 8 Sekunden (z. B. Fenster angehalten oder geschlossen), gibt es einen Hinweis
  const ac = new AbortController(), uhr = setTimeout(() => ac.abort(), 8000);
  fetch("lernstand", { method: "POST", headers: { "Content-Type": "application/json" }, body, signal: ac.signal })
    .then(r => { clearTimeout(uhr); if (r.ok) letzteDateiSicherung = new Date(); else if (r.status !== 409) speicherWarnung(); })
    .catch(() => { clearTimeout(uhr); speicherWarnung(); });
}
let letzteWarnung = 0;
function speicherWarnung() {
  if (Date.now() - letzteWarnung < 60000) return; // höchstens einmal pro Minute
  letzteWarnung = Date.now();
  toast("⚠️ Dein Fortschritt kann gerade nicht im Ordner gespeichert werden. Ist das schwarze Fenster „LernApp starten“ noch offen? Wenn jemand hineingeklickt hat: dort einmal Esc drücken.", 9000);
}
async function standLaden() {
  if (!SERVER) return;
  try {
    const r = await fetch("daten/lernstand.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) {
      const o = await r.json();
      if (o && o.kiste && (o.gespeichert || "") > (S.gespeichert || "")) { // Datei ist neuer (z. B. Browser hat gelöscht)
        S = tiefMischen(JSON.parse(JSON.stringify(START)), o);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      }
    }
  } catch (e) {}
  dateiGeprueft = true;
  dateiSpeichern(); // beim ersten Mal wird die Datei angelegt
}
if (SERVER) {
  addEventListener("pagehide", () => dateiSpeichern(true));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") dateiSpeichern(true); });
}
function K(w) { return S.kiste[w.id] || (S.kiste[w.id] = { b: 0, due: "", r: 0, f: 0 }); }
function aktiv() { const set = S.ein.seiten.length ? S.ein.seiten : SEITEN; return W.filter(w => set.includes(w.s)); }

/* ================== Helfer ================== */
const $app = document.getElementById("app");
function h(tag, attr, ...kids) {
  const el = document.createElement(tag);
  if (attr) for (const k in attr) {
    if (k === "class") el.className = attr[k];
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), attr[k]);
    else if (k === "html") el.innerHTML = attr[k];
    else el.setAttribute(k, attr[k]);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
function zeige(...els) { $app.replaceChildren(...els.flat().filter(x => x !== null && x !== undefined && x !== false)); window.scrollTo(0, 0); } // leere Teile nicht als „null“ anzeigen
function mische(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function zufall(a) { return a[Math.floor(Math.random() * a.length)]; }

/* ================== Sprache (Vorlesen) ================== */
let stimme = null, stimmeDE = null;
// Englische Stimme: zuerst die in ⚙️ gewählte, sonst britische Qualitätsstimme (Edge: "Online (Natural)", Chrome: "Google UK English"),
// sonst andere britische, sonst andere englische. Nie eine deutsche Stimme für Englisch.
function englischeStimmen() { return ("speechSynthesis" in window ? speechSynthesis.getVoices() : []).filter(x => /^en([-_]|$)/i.test(x.lang)); }
function stimmeWaehlen() {
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  const gut = x => /Natural|Neural|Google|Premium|Enhanced/i.test(x.name) && !/Multilingual|Mehrsprachig/i.test(x.name);
  const en = englischeStimmen(), gb = en.filter(x => /^en[-_]GB/i.test(x.lang));
  stimme = (S.ein.stimme && en.find(x => x.name === S.ein.stimme)) || gb.find(gut) || gb.find(x => x.localService) || gb[0]
    || en.find(gut) || en.find(x => x.localService) || en[0] || null;
  const deAlle = v.filter(x => /^de([-_]|$)/i.test(x.lang)), de = deAlle.filter(x => /^de[-_]DE/i.test(x.lang) || /^de$/i.test(x.lang));
  stimmeDE = (S.ein.stimmeDE && deAlle.find(x => x.name === S.ein.stimmeDE)) || de.find(gut) || de.find(x => x.localService) || de[0] || deAlle[0] || null;
}
if ("speechSynthesis" in window) { stimmeWaehlen(); speechSynthesis.onvoiceschanged = stimmeWaehlen; }
function sprechText(w) {
  if (w.say) return w.say;
  return w.en.replace(/\(to\)\s*/g, "").replace(/\bsth\./g, "something").replace(/\bsb\./g, "somebody")

/* ---------- Dauer der Tagesrunde ----------

   Sobald genug eigene Messwerte da sind (je 8), rechnet die App mit den gemessenen Zeiten. 15 % Zuschlag für Wiederholungen. */

  const f = s.w, lang = f.satz.replace("{}", gross(f.l, f.satz));
  const kurz = [f.k, ...(f.kAlt || [])].map(k => f.satz.replace("{}", gross(k, f.satz)));
  s.laenge = kurz[0].length;
  const naechster = e => kurz.reduce((b, x) => abstand(norm(e), norm(x)) < abstand(norm(e), norm(b)) ? x : b, kurz[0]);
  tippFeld(R, s, { lbl: "✂️ Schreib den ganzen Satz mit Kurzform", prompt: lang, promptKlein: true,
    unterPrompt: h("div", { class: "muted", style: "margin-top:6px" }, "Aus „" + f.l + "“ wird …?"), pruef: e => pruefeFormen(e, kurz),
    loesung: kurz[0], tipLoesung: kurz[0], vergleich: e => vergleich(f, e, naechster(e)), mutZiele: kurz,
    extra: kfInfo(f), vorlesen: kurz[0], platzhalter: "Satz mit Kurzform …" });
}

function ausspracheTipp(f, alt) {
  const A = [].concat(alt).map(norm), lang = norm(f.l);
  if (A.some(a => (" " + a + " ").includes(" " + lang + " "))) return h("div", { class: "hinweis" }, "🙂 Das war die Langform „" + f.l + "“ – sag es kürzer: " + f.k);

/* ================== Paare finden: 6 Paare, Stoppuhr, Rekord ================== */

function paareWoerter(n, mitKF, basis) {
  const ziel = mitKF && KF.length ? n - 1 : n, ws = [], schon = new Set();
  for (const w of [...mische(basis || []), ...mische(aktiv())]) {
    if (ws.length >= ziel) break;
    if (schon.has(w.de) || schon.has(w.en)) continue;
    schon.add(w.de); schon.add(w.en); ws.push(w);
  }
  if (mitKF && KF.length) ws.push(zufall(KF));

}

    }

  }
  zeige(opt.kopf || h("div", { class: "qhead" }, h("button", { class: "x", onclick: () => { clearInterval(tick); start(); }, "aria-label": "Beenden" }, "✕"), h("div", { style: "flex:1;font-weight:800" }, "🧩 Finde die Paare")),
    h("div", { class: "row", style: "margin-bottom:10px" }, h("span", { class: "muted", style: "flex:1;min-width:180px" }, "Tippe links ein englisches Wort und rechts die passende Bedeutung (bei Kurzformen: die Langform)."), uhr, status),
    h("div", { class: "paare" }, h("div", { style: "display:grid;gap:10px" }, L), h("div", { style: "display:grid;gap:10px" }, Rr)));

function paare() {
  const ws = paareWoerter(6, true);

    if (neu) S.rekord[key] = sek; speichern();

      h("div", { class: "card coach" }, h("div", { class: "owl" }, "🦉"), h("div", { class: "bubble" }, fehler === 0 ? "Alle Paare ohne Fehler – Dein Gedächtnis arbeitet super! 🧩" : "Alle Paare gefunden! Mit jedem Versuch merkst Du Dir mehr. 💪")),
      h("div", { class: "card", style: "text-align:center;font-size:20px;font-weight:800" }, zeit),

function paareSchritt(R, s) {

}

/* ================== Satz-Baustelle: Sätze aus dem Buch ergänzen oder aus Wörtern bauen ==================
   Quelle sind nur die Beispielsätze (bsp) aus vokabeln.js – also Sätze aus dem Schulbuch. */
function lueckeFuer(w) {
  if (!w || w.kf || !w.bsp) return null;
  const formen = sollFormen(w).concat([w.en.replace(/\(to\)\s*/g, "")]).map(f => f.replace(/\.\.\.|…/g, "").trim().replace(/[.?!]$/, ""))
    .filter(f => f.length >= 2).sort((a, b) => b.length - a.length);
  for (const f of formen) {
    const re = new RegExp("(^|[^A-Za-z'])(" + f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![A-Za-z'])", "i");
    const m = w.bsp.match(re);
    if (m) { const von = m.index + m[1].length; return { satz: w.bsp.slice(0, von) + "_____" + w.bsp.slice(von + m[2].length), wort: m[2] }; }
  }
  return null;
}
function puzzleTeile(w) {
  if (!w || w.kf || !w.bsp || /[–"„“]/.test(w.bsp)) return null;
  const teile = w.bsp.replace(/[.,!?;:]/g, "").split(/\s+/).filter(Boolean);
  return teile.length >= 3 && teile.length <= 9 ? teile : null;
}
function satzLuecke(R, s) {
  const w = s.w, l = lueckeFuer(w);
  if (!l) return strengTippen(R, s);
  tippFeld(R, s, { lbl: "🧱 Ergänze den Satz", prompt: l.satz, promptKlein: true,
    unterPrompt: h("div", { style: "font-weight:700;color:var(--soft);margin-top:6px" }, "Das fehlende Wort heißt auf Deutsch: „" + deFrage(w).kern + "“"),
    pruef: e => pruefe(w, e), loesung: w.bsp, tipLoesung: l.wort, mutZiele: loesungen(w),
    okExtra: e => buchHinweis(w, e), neinExtra: e => nichtHinweis(w, e), vorlesen: w.bsp, platzhalter: "fehlendes Wort …" });
}
function satzPuzzle(R, s) {
  const w = s.w, teile = puzzleTeile(w);
  if (!teile) return satzLuecke(R, s);
  const pool = mische(teile.map((t, i) => ({ t, i })));
  if (pool.length > 1 && pool.every((x, i) => x.i === i)) pool.push(pool.shift()); // nicht schon richtig sortiert anbieten
  let gelegt = [], fertig = false;
  const ziel = h("div", { class: "satz-ziel" }), vorrat = h("div", { class: "satz-vorrat" }), fb = h("div");
  const pruefKnopf = h("button", { class: "btn", style: "margin-top:14px" }, "Prüfen ✓");
  function zeichnen() {
    ziel.replaceChildren(...(gelegt.length
      ? gelegt.map((x, k) => h("button", { class: "kachel gelegt", "aria-label": "Zurücklegen: " + x.t, onclick: () => { if (fertig) return; gelegt.splice(k, 1); zeichnen(); } }, x.t))
      : [h("span", { class: "muted" }, "Tippe die Wörter in der richtigen Reihenfolge an …")]));
    vorrat.replaceChildren(...pool.filter(x => !gelegt.includes(x)).map(x => h("button", { class: "kachel", onclick: () => { if (fertig) return; gelegt.push(x); zeichnen(); } }, x.t)));
    pruefKnopf.disabled = gelegt.length !== teile.length;
  }
  pruefKnopf.addEventListener("click", () => {
    if (fertig || gelegt.length !== teile.length) return;
    fertig = true;
    const richtigePlaetze = gelegt.filter((x, k) => x.t.toLowerCase() === teile[k].toLowerCase()).length, ok = richtigePlaetze === teile.length;
    antwortGeben(R, s, ok ? "ok" : "no");
    sprich(w.bsp);
    const text = ok ? "✅ " + zufall(LOB) + " +2 ⭐"
      : richtigePlaetze >= teile.length - 2 ? "🤏 So knapp! Nur ein, zwei Wörter stehen noch an der falschen Stelle."
      : "💛 Ein kniffliger Satz! Schau Dir die richtige Reihenfolge an – beim nächsten Mal klappt es.";
    fb.replaceChildren(h("div", { class: "feedback " + (ok ? "ok" : richtigePlaetze >= teile.length - 2 ? "fast" : "no") }, text, h("div", { class: "loesung" }, w.bsp), lautBtn(w.bsp, true)), weiterKnopf(R));
    pruefKnopf.classList.add("hidden");
    document.getElementById("weiter").focus();
  });
  zeige(kopf(R),
    h("div", { class: "card prompt" }, h("div", { class: "lbl" }, "🧱 Bau den Satz"),
      h("div", { style: "font-weight:700;color:var(--soft);margin-top:4px" }, "mit „" + sollFormen(w)[0] + "“ (" + deFrage(w).kern + ")"), ziel),
    vorrat, pruefKnopf, fb);
  zeichnen();
}

/* ================== Belohnungsspiele ==================
   Nur als Belohnung nach einer beendeten Runde (Tier aus der Schatztruhe oder neuer Sticker).

function spielAngebot(tier) {

/* ================== Tastatur ================== */
let tasten = null;
document.addEventListener("keydown", e => {
  // Mikrofon per Tastatur: Leertaste (nicht beim Tippen; im leeren Eule-Feld schon) oder Strg + Leertaste (auch beim Tippen).
  // Steht der Fokus auf einem Knopf, bleibt die Leertaste dessen normale Taste.
  if (e.code === "Space" && !e.repeat && !(e.target && e.target.tagName === "BUTTON")) {
    const m = document.querySelector("#app .mikro");
    const imFeld = e.target && e.target.tagName === "INPUT";
    const leeresEulenFeld = imFeld && e.target.value === "" && e.target.closest(".eulenleiste");
    if (m && (e.ctrlKey || !imFeld || leeresEulenFeld)) { e.preventDefault(); m.click(); return; }
  }
  if (e.target && e.target.tagName === "INPUT") return;
  if (tasten) tasten(e);
});
const _zeige = zeige; // Tastenbelegung bei jedem Bildschirmwechsel zurücksetzen
zeige = function (...els) { tasten = null; _zeige(...els); };
